<!-- Zotero ViewFlow settings. Preference names and values are kept stable. -->
<linkset>
    <html:link rel="localization" href="zotero-preview.ftl"/>
</linkset>

<vbox id="zotero-prefpane-zotero-preview" class="viewflow-settings">
    <html:header class="viewflow-settings-header">
        <html:div class="viewflow-settings-title-row">
            <html:h1 data-l10n-id="zotero-preview-settings-heading"></html:h1>
            <html:span class="viewflow-version-badge">v12.3.2</html:span>
        </html:div>
        <html:p data-l10n-id="zotero-preview-settings-intro"></html:p>
    </html:header>

    <html:details class="viewflow-settings-card" open="open">
        <html:summary><html:span id="viewflow-style-heading" data-l10n-id="zotero-preview-settings-style-heading"></html:span></html:summary>
        <html:div class="viewflow-settings-card-content">
            <html:p class="viewflow-settings-description" data-l10n-id="zotero-preview-settings-style-description"></html:p>
            <menulist id="zotero-preview-style-menulist" native="true"
                preference="extensions.zoteropreview.citationstyle"
                aria-labelledby="viewflow-style-heading">
                <menupopup></menupopup>
            </menulist>
        </html:div>
    </html:details>

    <html:details class="viewflow-settings-card">
        <html:summary><html:span data-l10n-id="zotero-preview-settings-position"></html:span></html:summary>
        <html:div class="viewflow-settings-card-content">
            <html:p class="viewflow-settings-description" data-l10n-id="zotero-preview-settings-position-description"></html:p>
            <radiogroup native="true" id="extensions-zoteropreview-position" preference="extensions.zoteropreview.position">
                <radio id="extensions-zoteropreview-position-top" value="zotero-item-pane-header" data-l10n-id="zotero-preview-settings-position-top"/>
                <radio id="extensions-zoteropreview-position-afterInfo" value="zotero-editpane-item-box" data-l10n-id="zotero-preview-settings-position-afterinfo"/>
                <radio id="extensions-zoteropreview-position-bottom" value="zotero-editpane-related" data-l10n-id="zotero-preview-settings-position-bottom"/>
            </radiogroup>
        </html:div>
    </html:details>

    <html:details class="viewflow-settings-card">
        <html:summary><html:span data-l10n-id="zotero-preview-settings-display"></html:span></html:summary>
        <html:div class="viewflow-settings-card-content">
            <html:p class="viewflow-settings-description" data-l10n-id="zotero-preview-settings-display-description"></html:p>
            <radiogroup native="true" id="extensions-zoteropreview-whatToShow" preference="extensions.zoteropreview.whatToShow">
                <radio id="extensions-zoteropreview-whatToShow-both" value="zpboth" data-l10n-id="zotero-preview-settings-whatToShow-both"/>
                <radio id="extensions-zoteropreview-whatToShow-bib" value="zpbib" data-l10n-id="zotero-preview-settings-whatToShow-bib"/>
                <radio id="extensions-zoteropreview-whatToShow-intext" value="zpintext" data-l10n-id="zotero-preview-settings-whatToShow-intext"/>
            </radiogroup>
        </html:div>
    </html:details>

    <html:details class="viewflow-settings-card">
        <html:summary><html:span data-l10n-id="zotero-preview-settings-display-space"></html:span></html:summary>
        <html:div class="viewflow-settings-card-content">
            <html:p class="viewflow-settings-description" data-l10n-id="zotero-preview-settings-layout-description"></html:p>
            <html:div class="viewflow-settings-fields">
                <html:div class="viewflow-settings-field">
                    <label id="viewflow-fontsize-label" data-l10n-id="zotero-preview-settings-display-fontsize" control="zotero-preview-fontsize"></label>
                    <html:input class="html-input" id="zotero-preview-fontsize" type="number" min="0.2" max="3" step="0.1" size="4" data-preference="extensions.zoteropreview.fontsize" aria-labelledby="viewflow-fontsize-label"/>
                </html:div>
                <html:div class="viewflow-settings-field">
                    <label id="viewflow-spacing-label" data-l10n-id="zotero-preview-settings-display-linespacing" control="zotero-preview-spacing"></label>
                    <html:input class="html-input" id="zotero-preview-spacing" type="number" min="1" max="3" step="0.1" size="4" data-preference="extensions.zoteropreview.spacing" aria-labelledby="viewflow-spacing-label"/>
                </html:div>
                <html:div class="viewflow-settings-field">
                    <label id="viewflow-max-items-label" data-l10n-id="zotero-preview-settings-display-max-items" control="zotero-preview-max-items"></label>
                    <html:input class="html-input" id="zotero-preview-max-items" type="number" min="1" max="500" step="1" size="4" data-preference="extensions.zoteropreview.maxPreviewItems" aria-labelledby="viewflow-max-items-label"/>
                </html:div>
            </html:div>
        </html:div>
    </html:details>

    <html:section class="viewflow-release-info" aria-label="Release information">
        <html:div class="viewflow-release-title">版本信息</html:div>
        <html:div class="viewflow-release-row">
            <html:span class="viewflow-release-label">版本说明</html:span>
            <html:span>修复设置样式加载；统一配色、折叠卡片与原生控件</html:span>
        </html:div>
        <html:div class="viewflow-release-row">
            <html:span class="viewflow-release-label">构建日期</html:span>
            <html:time datetime="2026-10-20">2026-10-20</html:time>
        </html:div>
        <html:div class="viewflow-release-row">
            <html:span class="viewflow-release-label">安装包</html:span>
            <html:a href="https://github.com/groele/Zotero-ViewFlow/releases/download/zotero-viewflow-v12.3.2/Zotero-ViewFlow-12.3.2.xpi">下载 Zotero-ViewFlow-12.3.2.xpi</html:a>
        </html:div>
        <html:div class="viewflow-release-row">
            <html:span class="viewflow-release-label">项目仓库</html:span>
            <html:a href="https://github.com/groele/Zotero-ViewFlow">github.com/groele/Zotero-ViewFlow</html:a>
        </html:div>
    </html:section>
</vbox>
